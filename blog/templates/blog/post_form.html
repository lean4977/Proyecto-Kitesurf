{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="container mt-5 pb-5">
    <h2 class="fw-bold mb-4">{% if object %}Editar Publicación{% else %}Nueva Publicación{% endif %}</h2>
    <div class="card shadow-sm p-4 border-0 rounded-3" style="max-width: 800px;">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="mt-4">
                <button type="submit" class="btn btn-success me-2">Guardar</button>
                <a href="{% url 'blog:lista_posts' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
