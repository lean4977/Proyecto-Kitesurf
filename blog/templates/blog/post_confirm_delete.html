{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Publicación - Kitesurf</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white py-5">
    <div class="container mt-5 pb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm p-4 border-0 rounded-3 text-dark">
                    <h2 class="fw-bold text-danger mb-4">Eliminar Publicación</h2>
                    <div class="alert alert-danger shadow-sm">
                        <p class="mb-0">¿Estás seguro que querés eliminar permanentemente la publicación <strong>"{{ object.titulo }}"</strong>?</p>
                    </div>
                    <form method="POST" class="mt-3">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'blog:detalle_post' object.pk %}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
