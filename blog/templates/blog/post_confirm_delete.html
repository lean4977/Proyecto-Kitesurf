{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="container mt-5">
    <h2 class="fw-bold text-danger mb-4">Eliminar Publicación</h2>
    <div class="alert alert-danger shadow-sm" style="max-width: 600px;">
        <p>¿Estás seguro que querés eliminar permanentemente la publicación <strong>"{{ object.titulo }}"</strong>?</p>
        <form method="POST" class="mt-3">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger me-2">Sí, eliminar</button>
            <a href="{% url 'blog:detalle_post' object.pk %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
