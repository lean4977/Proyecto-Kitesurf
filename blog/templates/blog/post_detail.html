{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle - Kitesurf</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white py-5">
    <div class="container mt-5 pb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 rounded-3 text-dark mb-4">
                    {% if object.imagen %}
                        <img src="{{ object.imagen.url }}" class="card-img-top" alt="Imagen">
                    {% endif %}
                    <div class="card-body p-5">
                        <h1 class="card-title fw-bold">{{ object.titulo }}</h1>
                        <h4 class="text-muted mb-4">{{ object.subtitulo }}</h4>
                        <hr>
                        <p class="card-text fs-5">{{ object.cuerpo }}</p>
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{% url 'blog:lista_posts' %}" class="btn btn-outline-light">Volver al Blog</a>
                    {% if user.is_authenticated and user == object.autor %}
                    <div>
                        <a href="{% url 'blog:editar_post' object.pk %}" class="btn btn-warning me-2">Editar</a>
                        <a href="{% url 'blog:eliminar_post' object.pk %}" class="btn btn-danger">Eliminar</a>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
